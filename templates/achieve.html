{% extends "base.html" %}
{% block content %}

<a href="/wish/{{ wish.id }}" class="text-sm text-stone-500">← 戻る</a>

<h1 class="mt-4 text-2xl font-bold tracking-tight">おめでとうございます</h1>
<p class="mt-2 text-sm leading-relaxed text-stone-500">
  「{{ wish.title }}」を達成しました。<br>写真と、今の気持ちを残しておきましょう。
</p>

<form method="post" action="/wish/{{ wish.id }}/achieve" enctype="multipart/form-data" class="mt-6 space-y-5">
  <div>
    <label class="block text-sm font-medium">写真</label>
    <input type="file" name="photo" accept="image/*"
           class="mt-2 w-full rounded-2xl border border-stone-300 bg-white p-4 text-sm">
  </div>

  <div>
    <label class="block text-sm font-medium">感想</label>
    <textarea name="note" rows="6" placeholder="やってみてどうだったか、正直に。"
              class="mt-2 w-full rounded-2xl border border-stone-300 bg-white p-4 text-base leading-relaxed outline-none focus:border-stone-900"></textarea>
  </div>

  <button type="submit"
          class="w-full rounded-full bg-amber-500 py-4 font-medium text-white">
    記録する
  </button>
</form>

{% endblock %}
