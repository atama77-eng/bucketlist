{% extends "base.html" %}
{% block content %}

<a href="/" class="text-sm text-stone-500">← 戻る</a>

<h1 class="mt-4 text-2xl font-bold tracking-tight">何をやりたいですか？</h1>
<p class="mt-2 text-sm leading-relaxed text-stone-500">
  思いついたまま書いてください。<br>あとで質問に答えながら整理していきます。
</p>

<form method="post" action="/new" class="mt-6">
  <textarea name="title" required rows="3" autofocus
            placeholder="例：オーロラを見に行く"
            class="w-full rounded-2xl border border-stone-300 bg-white p-4 text-base leading-relaxed outline-none focus:border-stone-900"></textarea>

  <button type="submit"
          class="mt-4 w-full rounded-full bg-stone-900 py-4 font-medium text-white">
    次へ
  </button>
</form>

{% endblock %}
