{% extends "base.html" %}
{% block content %}

<a href="/wish/{{ wish.id }}" class="text-sm text-stone-500">← 戻る</a>

<p class="mt-4 text-xs font-medium tracking-wide text-stone-400">次の一歩</p>
<h1 class="mt-1 text-xl font-bold leading-snug">{{ wish.title }}</h1>

{% if error %}
<div class="mt-6 rounded-2xl border border-stone-200 bg-white p-5 text-sm leading-relaxed text-stone-600">
  {{ error }}
</div>
<a href="/wish/{{ wish.id }}" class="mt-4 block rounded-full bg-stone-900 py-4 text-center font-medium text-white">
  戻る
</a>

{% else %}
<p class="mt-4 text-sm leading-relaxed text-stone-500">
  あなたのメモを読んだうえでの提案です。<br>取り入れるものを選んでください。
</p>

<form method="post" action="/wish/{{ wish.id }}/suggest" class="mt-5">
  <div class="space-y-3">
    {% for s in suggestions %}
    <label class="block rounded-2xl border border-stone-200 bg-white p-4">
      <div class="flex items-start gap-3">
        <input type="checkbox" name="chosen" value="{{ s.text }}" checked
               class="mt-1 h-5 w-5 shrink-0 accent-stone-900">
        <div class="min-w-0">
          <p class="text-sm font-medium leading-relaxed">{{ s.text }}</p>
          {% if s.reason %}
          <p class="mt-1.5 text-xs leading-relaxed text-stone-500">{{ s.reason }}</p>
          {% endif %}
        </div>
      </div>
    </label>
    {% endfor %}
  </div>

  <button type="submit"
          class="mt-5 w-full rounded-full bg-stone-900 py-4 font-medium text-white">
    ToDoに追加する
  </button>
</form>

<a href="/wish/{{ wish.id }}/suggest" class="mt-3 block py-2 text-center text-sm text-stone-400">
  別の提案を出す
</a>
{% endif %}

{% endblock %}
